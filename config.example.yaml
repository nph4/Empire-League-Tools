# Copy this file to config.yaml and fill in your league's details.
# The league must be set to "open" (public) so no ESPN auth cookies are needed.

league_id: 123456
year: 2026

# Your exact ESPN team name. Used as the default team for tools that need
# to know "my" roster/budget (e.g. FAAB bid suggestions).
my_team_name: "Example Team Name"

# Optional: path to your own dynasty player values/rankings. Two file
# shapes are accepted, auto-detected from the header:
#   * "name,value" rows (any scale — only relative order/magnitude
#     matters), e.g. a KeepTradeCut value export.
#   * A raw FantasyPros rankings export ("RK,TIERS,PLAYER NAME,...") — has
#     ranks but no values, so the rank is mapped to a value curve for you
#     (no hand-editing into name,value needed).
# Players ESPN knows about but that are missing from this file fall back to
# a value derived from their ESPN projected points. Shared by the auction
# and FAAB tools. Omit this key to rely on the ESPN fallback for every
# player.
values_csv: "Ranking CSVs/player_values.csv"

# Optional: only used when values_csv is a FantasyPros rankings export.
# How many ranks it takes the derived value to halve — lower concentrates
# more value (and auction dollars) on the very top players. Default 30.
values_csv_rank_half_life: 30

# Auction draft settings
auction:
  budget_per_manager: 200
  # Roster construction (starters/flex/bench counts, and total roster size)
  # is read automatically from your ESPN league's settings, not configured
  # here.

# FAAB waiver settings
faab:
  # Cap on a single suggested bid, as a fraction of your remaining FAAB
  # budget. E.g. 0.35 means the single best available free agent at a
  # position can be suggested up to 35% of what you have left; bid size
  # falls off quickly for lesser adds.
  max_bid_share: 0.35
  # Multiplier applied when a free agent would only fill your bench (i.e.
  # your starting/flex slots at their position are already full), rather
  # than an open starter or flex slot. Roster requirements are read
  # automatically from your ESPN league's settings, same as the auction.
  bench_only_discount: 0.4

# Draft cheat sheet settings
cheatsheet:
  # Optional: path to a CSV of "name,tier_override,flags,notes,window_fit"
  # rows — your own hand-maintained tier overrides, situational flags (e.g.
  # camp-riser, depth-chart-battle — semicolon-separated if more than
  # one), free-text notes, and window_fit (a multiplier, default 1.0,
  # for hand-adjusting a player's rank toward or away from this league's
  # actual win-timing target — e.g. seasons 4&5 or 5&6 of this iteration —
  # rather than a generic dynasty contention window). Meant to be updated
  # as often as you like between now and draft day; omit this key (or
  # point it at a file that doesn't exist yet) to get an auto-tiered sheet
  # with no manual annotations.
  notes_csv: "Cheetsheet/cheatsheet_notes.csv"
  # How big a relative value drop (as a fraction of the higher value)
  # triggers a new tier within a position. Lower = more, narrower tiers.
  tier_gap_threshold: 0.15
  # Optional: pro_team -> short flag text for teams with a known in-league
  # homer bias (managers who'll pay above model value at auction/FAAB).
  fan_bias_teams:
    MIN: "MN-bias"
    WSH: "WAS-bias-minor"

# Trade evaluator settings
trade:
  # Soft positional-need nudges, applied to the REST-OF-SEASON grade only —
  # the long-term (dynasty) grade stays a pure value-in vs value-out delta
  # on the values_csv pool. A received player who fills an open
  # starting/flex slot on your roster (or a player you give up from a slot
  # you're now thin at) has their projected-points value scaled by
  # need_boost; a received player who'd only sit on your bench is scaled by
  # depth_discount (same idea as faab.bench_only_discount). Kept near 1.0
  # on purpose — need is a tie-breaker, not the grade. Roster construction
  # is read from ESPN, same as the other tools.
  need_boost: 1.10
  depth_discount: 0.90
  # Hard cap on how far that nudge can move the fairness score, so the
  # letter never swings more than ~one grade no matter how the multipliers
  # above are set.
  need_swing_cap: 0.10
